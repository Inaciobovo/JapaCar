<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ pageTitle if pageTitle else 'Acesso negado' }} — JAPACAR</title>
    <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card text-center">
        <div class="login-logo">JP</div>
        <h1>{{ pageTitle if pageTitle else 'Acesso negado' }}</h1>
        <p class="subtitle">
            {% if mensagem %}
                {{ mensagem }}
            {% else %}
                Seu perfil não tem permissão para ver esta área do sistema.
            {% endif %}
        </p>
        <p class="text-muted small mb-4">
            Se você precisa deste acesso, fale com o administrador da oficina.
        </p>
        <a href="/atendimentos" class="login-btn text-decoration-none d-block">Ir para os serviços</a>
    </div>
</div>
</body>
</html>
