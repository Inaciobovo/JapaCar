[pytest]
# `pythonpath = .` coloca a raiz do projeto no sys.path. Sem isso, rodar
# `pytest` direto (em vez de `python -m pytest`, que já insere o CWD) falha
# com ModuleNotFoundError: No module named 'app' em qualquer clone limpo —
# a suite nunca roda fora da maquina onde foi escrita.
pythonpath = .

# A suite e de aplicacao, nao de biblioteca: `pytest` sem argumento nao deve
# varrer .venv nem uploads.
testpaths = tests
norecursedirs = .venv uploads backups __pycache__ .pytest_cache
