# JAPACAR - producao (Oracle Cloud Free ARM)
# app.sock? Nao: rede interna + Caddy como reverse proxy com HTTPS (Let's Encrypt)
#
# Segurança: a SECRET_KEY NÃO tem valor padrão aqui. `${SECRET_KEY:?...}` faz o
# `docker compose up` abortar se o arquivo .env não a definir — subir com uma
# chave previsível permitiria forjar o cookie de sessão e entrar sem senha.

services:
  app:
    build: .
    image: japacar:1.0.0
    restart: unless-stopped
    environment:
      - FLASK_ENV=prod
      - TZ=America/Sao_Paulo
      - SECRET_KEY=${SECRET_KEY:?defina SECRET_KEY no .env antes de subir}
      - UPLOAD_DIR=/app/data/uploads
      # Criar admin/admin123 no boot é o caminho mais curto para uma invasão.
      # O primeiro usuário é criado por comando:
      #   docker compose exec app flask usuario-criar --login admin --perfil ADMIN
      - SEED_ON_STARTUP=0
    volumes:
      - /opt/japacar/data:/app/data
    networks:
      - japacar
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - /opt/japacar/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - japacar
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Necessário para o Caddy fazer bind nas portas 80/443 e abrir o socket.
      - NET_BIND_SERVICE
    depends_on:
      - app

networks:
  japacar:

volumes:
  caddy_data:
  caddy_config:
